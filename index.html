<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel Idle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #eee;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
        }
        h1 { font-size: 22px; margin-bottom: 12px; color: #ffcc00; }
        .balance {
            font-size: 20px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .balance b { color: #ffcc00; }
        #wheel {
    position: relative;
    height: 140px;
    background: #2a2a2a;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
}

#wheel-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    will-change: transform;
}

#wheel-track img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin: 0 10px;
    flex-shrink: 0;
}

#wheel-pointer {
    position: absolute;
    left: 50%;
    top: 0;
    width: 3px;
    height: 100%;
    background: #ffcc00;
    transform: translateX(-50%);
    box-shadow: 0 0 12px #ffcc00;
    z-index: 2;
}
        #inventory {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 8px;
            min-height: 60px;
            text-align: left;
            font-size: 15px;
        }
        #inventory div { padding: 6px; border-bottom: 1px solid #3a3a3a; }
        #inventory div:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <h1>💊 Cartel Idle</h1>

    <div class="balance">Баланс: <b id="balance">0</b> ⭐</div>

    <div id="wheel">
    <div id="wheel-track"></div>
    <div id="wheel-pointer"></div>
</div>

    <button id="spin-btn">Крутить (1 ⭐)</button>

    <!-- ВРЕМЕННЫЕ КНОПКИ ДЛЯ ТЕСТА — удали их перед релизом -->
    <button id="cheat-btn" class="cheat-btn">+100 💵 (чит)</button>
    <button id="reset-btn" class="reset-btn">🗑 Сбросить прогресс</button>

    <h2>🎒 Инвентарь</h2>
    <div id="inventory"><div>Пусто</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ==== ПРИЗЫ ====
        // weight = шанс выпадения (чем больше, тем чаще)
        // stars > 0  → сразу добавляет деньги к балансу
        // stars = 0  → падает в инвентарь как предмет
        const PRIZES = [
            { id: 'empty', icon: 'img/empty.png', name: 'Пусто',    stars: 0, weight: 50 },
            { id: 'car',   icon: 'img/car1.png',   name: 'Машина',   stars: 1, weight: 30 },
            { id: 'money', icon: 'img/money.png', name: '5 баксов', stars: 5, weight: 12 },
        ];

        let balance = 0;
        let inventory = [];
        let spinning = false;

        // ==== ЭЛЕМЕНТЫ ====
        const $balance   = document.getElementById('balance');
        const $spinBtn   = document.getElementById('spin-btn');
        const $inventory = document.getElementById('inventory');

        // ==== СОХРАНЕНИЕ ====
        function save() {
            tg.CloudStorage.setItem('balance', String(balance));
            tg.CloudStorage.setItem('inventory', JSON.stringify(inventory));
        }

        function load(callback) {
            tg.CloudStorage.getItem('balance', (err, val) => {
                if (!err && val) balance = parseInt(val, 10) || 0;
                tg.CloudStorage.getItem('inventory', (err2, val2) => {
                    if (!err2 && val2) {
                        try { inventory = JSON.parse(val2); } catch(e) { inventory = []; }
                    }
                    if (callback) callback();
                });
            });
        }

        // ==== ОТРИСОВКА ====
        function render() {
            $balance.innerText = balance;
            $spinBtn.disabled = spinning || balance < 1;

            if (inventory.length === 0) {
                $inventory.innerHTML = '<div>Пусто</div>';
            } else {
                const counts = {};
                inventory.forEach(id => counts[id] = (counts[id] || 0) + 1);
                $inventory.innerHTML = Object.entries(counts).map(([id, n]) => {
                    const p = PRIZES.find(x => x.id === id);
                    if (!p) return '';
                    return `<div><img src="${p.icon}" width="24" style="vertical-align:middle"> ${p.name} ×${n}</div>`;
                }).join('');
            }
        }

        // ==== ВЫБОР ПРИЗА (взвешенный рандом) ====
        function pickPrize() {
            const total = PRIZES.reduce((s, p) => s + p.weight, 0);
            let r = Math.random() * total;
            for (const p of PRIZES) {
                if (r < p.weight) return p;
                r -= p.weight;
            }
            return PRIZES[0];
        }

        // ==== КРУТКА (рулетка) ====
const $wheelTrack = document.getElementById('wheel-track');

// Ширина одной ячейки: картинка 100px + отступы по 10px с двух сторон = 120px
const ITEM_WIDTH = 120;
const ITEM_GAP = 10; // margin между картинками (0 10px)

// Строим длинную ленту из случайных призов
function buildTrack(count) {
    $wheelTrack.innerHTML = '';
    for (let i = 0; i < count; i++) {
        const p = PRIZES[Math.floor(Math.random() * PRIZES.length)];
        const img = document.createElement('img');
        img.src = p.icon;
        $wheelTrack.appendChild(img);
    }
}

// Крутим рулетку и останавливаемся на призе
function spinWheel(prize, duration = 3500) {
    const wheelWidth = document.getElementById('wheel').offsetWidth;
    const centerOffset = wheelWidth / 2 - ITEM_WIDTH / 2;

    // Сначала мелькает много призов (создаём ленту)
    const trackLength = 40;
    buildTrack(trackLength);

    // Ставим выигрышный приз в позицию ближе к концу
    const winnerIndex = trackLength - 5;
    const winnerImg = $wheelTrack.children[winnerIndex];
    winnerImg.src = prize.icon;

    // Начальная позиция — левый край ленты
    let startX = 0;
    $wheelTrack.style.transition = 'none';
    $wheelTrack.style.transform = `translateX(${startX}px)`;

    // Куда надо приехать, чтобы выигрышный приз оказался в центре
    const targetX = -(winnerIndex * (ITEM_WIDTH + ITEM_GAP * 2)) + centerOffset;

    // Небольшое случайное смещение, чтобы не всегда точно в центр
    const jitter = (Math.random() - 0.5) * 40;
    const finalX = targetX + jitter;

    // Принудительно применить начальную позицию перед анимацией
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            $wheelTrack.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;
            $wheelTrack.style.transform = `translateX(${finalX}px)`;
        });
    });
}

$spinBtn.addEventListener('click', () => {
    if (spinning || balance < 1) return;
    spinning = true;
    balance -= 1;
    render();

    const prize = pickPrize();

    spinWheel(prize, 3500);

    setTimeout(() => {
        if (prize.stars > 0) {
            balance += prize.stars;
        } else if (prize.id !== 'empty') {
            inventory.push(prize.id);
        }

        spinning = false;
        save();
        render();
    }, 3600);
});

        // ==== ЧИТ-КНОПКА (для теста) ====
        document.getElementById('cheat-btn').addEventListener('click', () => {
            balance += 100;
            save();
            render();
        });

        // ==== СБРОС ПРОГРЕССА ====
        document.getElementById('reset-btn').addEventListener('click', () => {
            tg.CloudStorage.removeItem('balance');
            tg.CloudStorage.removeItem('inventory');
            balance = 0;
            inventory = [];
            save();
            render();
            location.reload();
        });

        // ==== СТАРТ ====
        load(() => {
            // Если игра запущена впервые (пусто) — даём 10 звёзд
            if (balance === 0 && inventory.length === 0) {
                balance = 10;
                save();
            }
            render();
        });
    </script>
</body>
</html>
