<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel Idle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #eee;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
            padding-bottom: 80px; /* под нижние табы */
        }
        h1 { font-size: 22px; margin-bottom: 12px; color: #ffcc00; }

        /* ==== БАЛАНСЫ ==== */
        .balances {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .balance {
            flex: 1;
            font-size: 16px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .balance b { color: #ffcc00; }
        .balance img { width: 22px; height: 22px; object-fit: contain; }

        /* ==== РУЛЕТКА ==== */
        #wheel {
            position: relative;
            height: 140px;
            background: #2a2a2a;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        #wheel-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            will-change: transform;
        }
        #wheel-track.idle {
            animation: idleScroll 40s linear infinite;
        }
        @keyframes idleScroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-3600px); }
        }
        #wheel-track img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 10px;
            flex-shrink: 0;
        }
        #wheel-pointer {
            position: absolute;
            left: 50%;
            top: 0;
            width: 3px;
            height: 100%;
            background: #ffcc00;
            transform: translateX(-50%);
            box-shadow: 0 0 12px #ffcc00;
            z-index: 2;
        }

        /* ==== КНОПКИ ==== */
        button {
            padding: 14px 28px;
            font-size: 16px;
            background: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 8px;
        }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        button:active:not(:disabled) { background: #e0b400; }
        .cheat-btn { background: #ff4444; color: white; }
        .reset-btn { background: #444; color: white; }

        h2 { font-size: 16px; margin: 16px 0 8px; color: #aaa; text-align: left; }

        /* ==== ИНВЕНТАРЬ ==== */
        #inventory {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 8px;
            min-height: 60px;
            text-align: left;
            font-size: 15px;
        }
        #inventory div { padding: 6px; border-bottom: 1px solid #3a3a3a; }
        #inventory div:last-child { border-bottom: none; }

        /* ==== ВКЛАДКИ (КОНТЕНТ) ==== */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ==== НИЖНИЕ ТАБЫ ==== */
        #tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #222;
            display: flex;
            border-top: 1px solid #3a3a3a;
            z-index: 50;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            background: transparent;
            color: #888;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0;
            margin: 0;
            transition: color 0.2s, background 0.2s;
        }
        .tab-btn.active {
            color: #ffcc00;
            background: #2a2a2a;
        }
        .tab-btn:hover:not(.active) {
            color: #ccc;
        }

        /* ==== ЗАГЛУШКА МАГАЗИНА ==== */
        .stub {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 40px 20px;
            color: #888;
            font-size: 16px;
            text-align: center;
        }
        .stub .big {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* ==== ОКНО ВЫИГРЫША ==== */
        #win-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #win-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        #win-box {
            position: relative;
            background: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 280px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.5);
            animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes popIn {
            0%   { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }
        #win-box img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 16px;
            animation: bounce 0.6s ease-out;
        }
        @keyframes bounce {
            0%   { transform: scale(0.3); }
            60%  { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        #win-title {
            font-size: 22px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #win-sub {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 20px;
        }
        #win-close {
            background: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Блёстки */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffcc00;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #ffcc00;
            animation: sparkleFly 1.2s ease-out forwards;
        }
        @keyframes sparkleFly {
            0%   { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>💊 Cartel Idle</h1>

    <!-- ==== БАЛАНСЫ ==== -->
    <div class="balances">
        <div class="balance">
            <img src="img/money.png" alt="баксы">
            <b id="balance">0</b>
        </div>
        <div class="balance">
            <img src="img/cabbage.png" alt="капуста">
            <b id="cabbage">0</b>
        </div>
    </div>

    <!-- ==== ВКЛАДКА: РУЛЕТКА ==== -->
    <div class="tab-content active" id="tab-wheel">
        <div id="wheel">
            <div id="wheel-track"></div>
            <div id="wheel-pointer"></div>
        </div>
        <button id="spin-btn">Крутить (1 💵)</button>
        <button id="cheat-btn" class="cheat-btn">+100 💵 (чит)</button>
        <button id="reset-btn" class="reset-btn">🗑 Сбросить прогресс</button>
    </div>

    <!-- ==== ВКЛАДКА: МАГАЗИН ==== -->
    <div class="tab-content" id="tab-shop">
        <div class="stub">
            <div class="big">🛒</div>
            <div>Скоро здесь будет оружие и броня картеля</div>
        </div>
    </div>

    <!-- ==== ВКЛАДКА: ИНВЕНТАРЬ ==== -->
    <div class="tab-content" id="tab-inventory">
        <h2>🎒 Инвентарь</h2>
        <div id="inventory"><div>Пусто</div></div>
    </div>

    <!-- ==== НИЖНИЕ ТАБЫ ==== -->
    <div id="tabs">
        <button class="tab-btn active" data-tab="wheel">🎰 Рулетка</button>
        <button class="tab-btn" data-tab="shop">🛒 Магазин</button>
        <button class="tab-btn" data-tab="inventory">🎒 Инвентарь</button>
    </div>

    <!-- ==== ОКНО ВЫИГРЫША ==== -->
    <div id="win-modal">
        <div id="win-box">
            <img id="win-img" src="" alt="">
            <div id="win-title">Выигрыш!</div>
            <div id="win-sub"></div>
            <button id="win-close">Забрать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ==== ПРИЗЫ ====
        // dollars — сколько баксов даёт
        // cabbage — сколько капусты даёт
        // weight  — шанс выпадения (чем больше, тем чаще)
        // effect  — 'sparkle' для блёсток, null для «Пусто»
        const PRIZES = [
            { id: 'empty',   icon: 'img/empty.png',   name: 'Пусто',    dollars: 0, cabbage: 0, weight: 50, effect: null },
            { id: 'car',     icon: 'img/car2.png',    name: 'Машина',   dollars: 0, cabbage: 0, weight: 30, effect: 'sparkle' },
            { id: 'money',   icon: 'img/money.png',   name: '5 баксов', dollars: 5, cabbage: 0, weight: 12, effect: 'sparkle' },
            { id: 'cabbage', icon: 'img/cabbage.png', name: 'Капуста',  dollars: 0, cabbage: 1, weight: 10, effect: 'sparkle' },
            { id: 'ak47',    icon: 'img/gunAK47.png', name: 'AK-47',    dollars: 0, cabbage: 0, weight: 5,  effect: 'sparkle' },
        ];

        // ==== СОСТОЯНИЕ ====
        let balance = 0;      // баксы
        let cabbage = 0;      // капуста
        let inventory = [];   // предметы
        let spinning = false;
        let idleMode = true;

        // ==== ЭЛЕМЕНТЫ ====
        const $balance    = document.getElementById('balance');
        const $cabbage    = document.getElementById('cabbage');
        const $spinBtn    = document.getElementById('spin-btn');
        const $inventory  = document.getElementById('inventory');
        const $wheelTrack = document.getElementById('wheel-track');
        const $winModal   = document.getElementById('win-modal');
        const $winImg     = document.getElementById('win-img');
        const $winTitle   = document.getElementById('win-title');
        const $winSub     = document.getElementById('win-sub');
        const $winClose   = document.getElementById('win-close');
        const $winBox     = document.getElementById('win-box');

        // ==== СОХРАНЕНИЕ ====
        function save() {
            tg.CloudStorage.setItem('balance', String(balance));
            tg.CloudStorage.setItem('cabbage', String(cabbage));
            tg.CloudStorage.setItem('inventory', JSON.stringify(inventory));
        }

        function load(callback) {
            tg.CloudStorage.getItem('balance', (err, val) => {
                if (!err && val) balance = parseInt(val, 10) || 0;
                tg.CloudStorage.getItem('cabbage', (err2, val2) => {
                    if (!err2 && val2) cabbage = parseInt(val2, 10) || 0;
                    tg.CloudStorage.getItem('inventory', (err3, val3) => {
                        if (!err3 && val3) {
                            try { inventory = JSON.parse(val3); } catch(e) { inventory = []; }
                        }
                        if (callback) callback();
                    });
                });
            });
        }

        // ==== ОТРИСОВКА ====
        function render() {
            $balance.innerText = balance;
            $cabbage.innerText = cabbage;
            $spinBtn.disabled = spinning || balance < 1;

            if (inventory.length === 0) {
                $inventory.innerHTML = '<div>Пусто</div>';
            } else {
                const counts = {};
                inventory.forEach(id => counts[id] = (counts[id] || 0) + 1);
                $inventory.innerHTML = Object.entries(counts).map(([id, n]) => {
                    const p = PRIZES.find(x => x.id === id);
                    if (!p) return '';
                    return `<div><img src="${p.icon}" width="24" style="vertical-align:middle"> ${p.name} ×${n}</div>`;
                }).join('');
            }
        }

        // ==== ВЫБОР ПРИЗА ====
        function pickPrize() {
            const total = PRIZES.reduce((s, p) => s + p.weight, 0);
            let r = Math.random() * total;
            for (const p of PRIZES) {
                if (r < p.weight) return p;
                r -= p.weight;
            }
            return PRIZES[0];
        }

        // ==== КРУТКА ====
        const ITEM_WIDTH = 120;

        function buildTrack(count) {
            $wheelTrack.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const p = PRIZES[Math.floor(Math.random() * PRIZES.length)];
                const img = document.createElement('img');
                img.src = p.icon;
                $wheelTrack.appendChild(img);
            }
        }

        function startIdle() {
            idleMode = true;
            $wheelTrack.classList.add('idle');
        }

        function stopIdle() {
            if (!idleMode) return;
            const style = window.getComputedStyle($wheelTrack);
            const matrix = new DOMMatrixReadOnly(style.transform);
            const currentX = matrix.m41;

            $wheelTrack.classList.remove('idle');
            $wheelTrack.style.transition = 'none';
            $wheelTrack.style.transform = `translateX(${currentX}px)`;
            void $wheelTrack.offsetWidth;

            idleMode = false;
        }

        function spinWheel(prize, duration = 3500) {
            stopIdle();

            const wheelWidth = document.getElementById('wheel').offsetWidth;
            const centerOffset = wheelWidth / 2 - ITEM_WIDTH / 2;

            const trackLength = 80;
            buildTrack(trackLength);

            const winnerIndex = trackLength - 10;
            const winnerImg = $wheelTrack.children[winnerIndex];
            winnerImg.src = prize.icon;

            $wheelTrack.style.transition = 'none';
            $wheelTrack.style.transform = 'translateX(0px)';
            void $wheelTrack.offsetWidth;

            const targetX = -(winnerIndex * ITEM_WIDTH) + centerOffset;
            const jitter = (Math.random() - 0.5) * 80;
            const finalX = targetX + jitter;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    $wheelTrack.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;
                    $wheelTrack.style.transform = `translateX(${finalX}px)`;
                });
            });
        }

        // ==== ОКНО ВЫИГРЫША ====
        function showWinModal(prize) {
            $winImg.src = prize.icon;

            if (prize.id === 'empty') {
                $winTitle.innerText = 'Пусто';
                $winSub.innerText = 'В этот раз не повезло';
            } else if (prize.cabbage > 0) {
                $winTitle.innerText = `+${prize.cabbage} капуста`;
                $winSub.innerText = 'Закинул в карман';
            } else if (prize.dollars > 0) {
                $winTitle.innerText = `+${prize.dollars} баксов`;
                $winSub.innerText = 'Наличка капнула в карман';
            } else {
                $winTitle.innerText = prize.name + ' в инвентаре!';
                $winSub.innerText = 'Забрал — молодец';
            }

            $winModal.classList.add('show');

            if (prize.effect === 'sparkle') {
                spawnSparkles($winBox, 18);
            }
        }

        function hideWinModal() {
            $winModal.classList.remove('show');
        }

        function spawnSparkles(parent, count) {
            const rect = parent.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;

            for (let i = 0; i < count; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';

                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const distance = 80 + Math.random() * 120;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                s.style.left = cx + 'px';
                s.style.top = cy + 'px';
                s.style.setProperty('--dx', dx + 'px');
                s.style.setProperty('--dy', dy + 'px');
                s.style.animationDelay = (Math.random() * 0.3) + 's';

                parent.appendChild(s);
                setTimeout(() => s.remove(), 1800);
            }
        }

        $winClose.addEventListener('click', hideWinModal);
        $winModal.addEventListener('click', (e) => {
            if (e.target === $winModal) hideWinModal();
        });

        // ==== ВКЛАДКИ ====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;

                // Все кнопки табов — снять active
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Все контенты — скрыть
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabName).classList.add('active');
            });
        });

        // ==== КНОПКА КРУТКИ ====
        $spinBtn.addEventListener('click', () => {
            if (spinning || balance < 1) return;
            spinning = true;
            balance -= 1;
            render();

            const prize = pickPrize();
            spinWheel(prize, 3500);

            setTimeout(() => {
                if (prize.dollars > 0) {
                    balance += prize.dollars;
                }
                if (prize.cabbage > 0) {
                    cabbage += prize.cabbage;
                }
                if (prize.dollars === 0 && prize.cabbage === 0 && prize.id !== 'empty') {
                    inventory.push(prize.id);
                }

                spinning = false;
                save();
                render();

                showWinModal(prize);
            }, 3600);
        });

        // ==== ЧИТ-КНОПКА ====
        document.getElementById('cheat-btn').addEventListener('click', () => {
            balance += 100;
            cabbage += 5;
            save();
            render();
        });

        // ==== СБРОС ====
        document.getElementById('reset-btn').addEventListener('click', () => {
            tg.CloudStorage.removeItem('balance');
            tg.CloudStorage.removeItem('cabbage');
            tg.CloudStorage.removeItem('inventory');
            balance = 0;
            cabbage = 0;
            inventory = [];
            save();
            render();
            location.reload();
        });

        // ==== СТАРТ ====
        load(() => {
            if (balance === 0 && cabbage === 0 && inventory.length === 0) {
                balance = 10;
                save();
            }
            buildTrack(60);
            startIdle();
            render();
        });
    </script>
</body>
</html>
